# Deliberately minimal. BUILD_PLAN M0 warns against spending day 1 on packaging
# ceremony; this file exists only so `pip install -e .` makes the top-level packages
# importable from any working directory. Without it, `python scripts/init_db.py`
# puts scripts/ on sys.path instead of the repo root and every import fails.

[project]
name = "vdel-student-side"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["variables", "collectors", "features", "memory", "agents", "system", "config"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default is "test*", which collects the document's testing_signal() as a test
# function the moment a test module imports it. Requiring the underscore keeps
# collection to things actually written as tests.
python_functions = "test_*"

[tool.ruff]
line-length = 100

# Selected explicitly, not left to ruff's defaults. Defaults vary by ruff version and a
# developer's global config bleeds into a bare `ruff check .`, so CI on a clean machine
# would enforce a different set than the one this code was written against -- including
# flagging the `noqa` codes below as unused. Pinning the selection makes the lint
# reproducible, which is the same reason the schema and the prompts are versioned.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Airflow DAGs are declarative: the operators are wired by `>>`, not by being referenced.
"dags/*" = ["F841"]

# Verbatim transcriptions from VDEL_Modules_1_2_Build.md. These files are held
# character-for-character against the source document so that a diff between the two is
# empty and any future divergence is visible. Restyling them to satisfy a linter would
# destroy that property for no behavioural gain, so the cosmetic rules are turned off
# here rather than the code being edited.
#   UP037  quoted forward-reference annotations
#   RUF005 tuple concatenation instead of unpacking
#   B008   BKTParams() as a default argument -- safe: the dataclass is frozen
"variables/mastery.py" = ["UP037", "RUF005", "B008"]
# DTZ007: the document parses GitHub's "...Z" timestamps with a naive %Y-%m-%dT%H:%M:%SZ
# format. Both operands are naive-UTC and only their difference is used (duration_s), so
# the arithmetic is correct; adopting %z here would be a change to transcribed code.
"collectors/collect_github.py" = ["DTZ007"]
