services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vdel-postgres
    environment:
      POSTGRES_DB: vdel
      POSTGRES_USER: vdel
      POSTGRES_PASSWORD: vdel
    ports:
      # Host 5433, not 5432. This machine runs a native postgresql-x64-13 service that
      # already owns 5432; Docker published the port without error but every host
      # connection reached PostgreSQL 13, which has no vdel role, and surfaced only as
      # "password authentication failed". Publishing on 5433 makes the project immune to
      # whatever the host already runs, which is the point of the M0 DoD: clone and run.
      - "5433:5432"
    volumes:
      - vdel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdel -d vdel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vdel_pgdata:
