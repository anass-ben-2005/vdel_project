version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: vdel-postgres
    environment:
      POSTGRES_DB: vdel
      POSTGRES_USER: vdel_user
      POSTGRES_PASSWORD: vdel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdel_user -d vdel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
