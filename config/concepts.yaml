# The concept taxonomy.
#
# WARNING -- these IDs are schema. CLAUDE.md section 8: they appear in columns, prompts
# and error mappings, and renaming one breaks history. That makes this file the most
# expensive thing in the repo to get wrong.
#
# TODO(verify): the real ~25 concepts live in VDEL_Modules_1_2_Build.md, which is not in
# this repo. The list below is a working placeholder chosen to match the identifiers
# CLAUDE.md cites by name (sql.joins, spark.aggregation, airflow.idempotency) and the
# ones collectors/error_classifier.py maps to. Reconcile before any real student data is
# collected -- after that, renames cost a migration.
#
# difficulty feeds KT-IDEM (variables/mastery.py) and is seeded into the items table.

concepts:
  - id: python.basics
    name: Python fundamentals
    typical_evidence: Syntax and imports resolve; script runs
    difficulty: 0.15
    prerequisites: []

  - id: python.control_flow
    name: Control flow and collections
    typical_evidence: Loops, conditionals and indexing behave as intended
    difficulty: 0.25
    prerequisites: [python.basics]

  - id: python.functions
    name: Functions and types
    typical_evidence: Functions compose; arguments and return types line up
    difficulty: 0.35
    prerequisites: [python.control_flow]

  - id: python.error_handling
    name: Error handling
    typical_evidence: Failure paths handled rather than allowed to crash
    difficulty: 0.45
    prerequisites: [python.functions]

  - id: sql.select
    name: SELECT and filtering
    typical_evidence: Single-table queries return the expected rows
    difficulty: 0.20
    prerequisites: []

  - id: sql.joins
    name: Joins and grouping
    typical_evidence: Multi-table queries with correct grain and no fan-out
    difficulty: 0.45
    prerequisites: [sql.select]

  - id: sql.window_functions
    name: Window functions
    typical_evidence: Ranking and running totals without self-joins
    difficulty: 0.60
    prerequisites: [sql.joins]

  - id: sql.indexing
    name: Indexing and query plans
    typical_evidence: Indexes chosen from the plan, not from guesswork
    difficulty: 0.70
    prerequisites: [sql.joins]

  - id: spark.rdd
    name: RDD fundamentals
    typical_evidence: Transformations and actions distinguished correctly
    difficulty: 0.40
    prerequisites: [python.functions]

  - id: spark.dataframe
    name: DataFrame API
    typical_evidence: Schema-aware operations rather than row-at-a-time Python
    difficulty: 0.50
    prerequisites: [spark.rdd]

  - id: spark.aggregation
    name: Aggregation and grouping
    typical_evidence: groupBy/agg producing the intended grain
    difficulty: 0.55
    prerequisites: [spark.dataframe]

  - id: spark.joins
    name: Joins and shuffles
    typical_evidence: Join strategy suits the data sizes; broadcast used deliberately
    difficulty: 0.65
    prerequisites: [spark.aggregation]

  - id: spark.performance
    name: Partitioning and caching
    typical_evidence: Partition counts and persistence chosen with a reason
    difficulty: 0.75
    prerequisites: [spark.joins]

  - id: airflow.dag
    name: DAG construction
    typical_evidence: DAG parses; dependencies express the real ordering
    difficulty: 0.35
    prerequisites: [python.functions]

  - id: airflow.operators
    name: Operators and task design
    typical_evidence: Work sits in the right operator with the right granularity
    difficulty: 0.45
    prerequisites: [airflow.dag]

  - id: airflow.scheduling
    name: Scheduling and backfill
    typical_evidence: Schedule interval and catchup behave as intended
    difficulty: 0.55
    prerequisites: [airflow.dag]

  - id: airflow.idempotency
    name: Idempotency
    typical_evidence: Re-running a task produces no duplicates and no drift
    difficulty: 0.70
    prerequisites: [airflow.operators]

  - id: data_modelling
    name: Data modelling
    typical_evidence: Grain, keys and types declared and respected
    difficulty: 0.55
    prerequisites: [sql.joins]

  - id: data_quality
    name: Data quality checks
    typical_evidence: Nulls, duplicates and ranges asserted rather than assumed
    difficulty: 0.60
    prerequisites: [data_modelling]

  - id: testing
    name: Testing
    typical_evidence: Tests exist, run in CI, and fail when the code is wrong
    difficulty: 0.50
    prerequisites: [python.functions]

  - id: documentation
    name: Readability and documentation
    typical_evidence: Names and docstrings explain intent; linter is clean
    difficulty: 0.30
    prerequisites: []

  - id: git
    name: Version control
    typical_evidence: Focused commits with messages that describe the change
    difficulty: 0.25
    prerequisites: []

  - id: ci_cd
    name: CI pipelines
    typical_evidence: Workflow runs green and fails loudly when it should
    difficulty: 0.50
    prerequisites: [git, testing]

  - id: debugging
    name: Debugging
    typical_evidence: Failures diagnosed from evidence rather than by trial and error
    difficulty: 0.55
    prerequisites: [python.error_handling]
