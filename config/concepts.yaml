# Concept taxonomy v1.
#
# Every id below is one that actually appears in the source documents -- in
# collectors/error_classifier.py's rule table, the Code Agent's anti-pattern table
# (VDEL_Modules_3_9_Build.md), or the worked examples. Nothing here is invented: the
# design document specifies "~25 curriculum concepts, area.concept IDs" but never
# enumerates the list, so the ids that are attested are the ones present.
#
# 19 of ~25. The remaining gap is real and should be closed from the VDEL curriculum,
# not from imagination -- CLAUDE.md section 8: these ids ARE schema. They appear in
# columns, prompts and error mappings, and renaming one breaks history.
#
# `difficulty` here is a COLD-START SEED only. The live value is items.difficulty =
# 1 - Beta-smoothed cohort pass rate (variables/mastery.py, DifficultyEstimator), which
# supersedes this seed as soon as n_cohort_obs > 0. BUILD_PLAN 1.1 asks for a difficulty
# field; the module document sources it from the cohort. Both are satisfied: this is the
# prior, the cohort provides the posterior.

concepts:
  # --- PySpark ---
  - id: spark.df_basics
    name: DataFrame basics
    typical_evidence: Column references resolve; schema understood
    difficulty: 0.4
    prerequisites: []

  - id: spark.transform_action
    name: Transformations vs actions
    typical_evidence: Lazy evaluation understood; actions triggered deliberately
    difficulty: 0.4
    prerequisites: [spark.df_basics]

  - id: spark.read
    name: Reading data sources
    typical_evidence: Sources read with explicit schema and options
    difficulty: 0.35
    prerequisites: [spark.df_basics]

  - id: spark.aggregation
    name: Aggregation and grouping
    typical_evidence: groupBy/agg produces the intended grain
    difficulty: 0.55
    prerequisites: [spark.df_basics]

  - id: spark.joins
    name: Joins
    typical_evidence: Join keys unambiguous; no accidental cartesian product
    difficulty: 0.55
    prerequisites: [spark.df_basics]

  - id: spark.window
    name: Window functions
    typical_evidence: Partitioning and ordering express the intended frame
    difficulty: 0.65
    prerequisites: [spark.aggregation]

  - id: spark.udf
    name: User-defined functions
    typical_evidence: UDFs used only where built-ins cannot serve
    difficulty: 0.6
    prerequisites: [spark.df_basics]

  - id: spark.partitioning
    name: Partitioning
    typical_evidence: Partition counts chosen with a reason; no OOM from skew
    difficulty: 0.7
    prerequisites: [spark.joins]

  - id: spark.caching
    name: Caching and persistence
    typical_evidence: Reused DataFrames persisted; cache released
    difficulty: 0.6
    prerequisites: [spark.transform_action]

  - id: spark.perf_tuning
    name: Performance tuning
    typical_evidence: Shuffles and broadcasts chosen from the plan
    difficulty: 0.75
    prerequisites: [spark.partitioning, spark.caching]

  # --- SQL ---
  - id: sql.select_filter
    name: SELECT and filtering
    typical_evidence: Single-table queries return the expected rows
    difficulty: 0.2
    prerequisites: []

  - id: sql.joins
    name: Joins
    typical_evidence: Multi-table queries with correct grain and no fan-out
    difficulty: 0.45
    prerequisites: [sql.select_filter]

  - id: sql.aggregation
    name: Aggregation and GROUP BY
    typical_evidence: Every selected column grouped or aggregated
    difficulty: 0.5
    prerequisites: [sql.select_filter]

  # --- Python ---
  - id: py.data_structures
    name: Data structures
    typical_evidence: Keys and indices accessed safely
    difficulty: 0.3
    prerequisites: []

  - id: py.pandas
    name: pandas
    typical_evidence: Views and copies handled deliberately
    difficulty: 0.45
    prerequisites: [py.data_structures]

  - id: py.errors_debugging
    name: Errors and debugging
    typical_evidence: Syntax clean; failures diagnosed from the traceback
    difficulty: 0.35
    prerequisites: []

  - id: py.testing
    name: Testing
    typical_evidence: Assertions present and meaningful; tests fail when code is wrong
    difficulty: 0.5
    prerequisites: [py.data_structures]

  # --- Airflow ---
  - id: airflow.operators
    name: Operators and task design
    typical_evidence: Work sits in the right operator at the right granularity
    difficulty: 0.45
    prerequisites: []

  - id: airflow.idempotency
    name: Idempotency
    typical_evidence: Re-running a task produces no duplicates and no drift
    difficulty: 0.7
    prerequisites: [airflow.operators]
